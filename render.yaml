services:
  - type: web
    name: executive-presence-audit-lab
    runtime: python
    plan: starter
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /
    disk:
      name: app-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/app.db
      - key: FLASK_DEBUG
        value: "0"
